name: Tech News Japanese Digest (Every ~10 Hours)

on:
  schedule:
    # 00:00 JST (15:00 UTC prev day)
    - cron: '0 15 * * *'
    # 10:00 JST (01:00 UTC) — 10h after the previous run
    - cron: '0 1 * * *'
    # 20:00 JST (11:00 UTC) — 10h after the previous run
    - cron: '0 11 * * *'
    # NOTE: 24 hours doesn't divide evenly by 10, so the gap from 20:00 back
    # to the next day's 00:00 run is only 4 hours instead of 10. This is a
    # GitHub Actions cron limitation (schedules repeat on a 24h clock), not
    # a bug — if you'd rather have perfectly even spacing, 3 runs/day at
    # 8h apart or 2 runs/day at 12h apart both divide evenly into 24h.
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max articles fetched per source, before capping (default: 5)'
        required: false
        default: '5'
      total_items:
        description: 'Total articles in the final digest, interleaved across sources (default: 30, 0 = no cap)'
        required: false
        default: '30'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-tech-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-trend-jp-publisher
    env:
      OUTPUT_DIR: data/news
      TARGET_LANGUAGE: ja
      DEFAULT_AUDIENCE: 日本の読者

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Japanese tech news digest
        run: |
          MAX_ITEMS="${{ github.event.inputs.max_items || '5' }}"
          TOTAL_ITEMS="${{ github.event.inputs.total_items || '30' }}"
          python -m global_trend_jp_publisher.cli run-tech-news \
            --sites-file data/inputs/tech_sites.txt \
            --max-items "$MAX_ITEMS" \
            --total-items "$TOTAL_ITEMS" \
            --news-dir data/news

      - name: Commit generated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then
            echo "No new articles to commit"
          else
            git commit -m "Tech news digest $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  deploy-pages:
    needs: generate-tech-digest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: global-trend-jp-publisher/data/news

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
